# 本包由一行根行与六行功能行组成：根行提供前端产物与聚合状态路由，六行分别是
# 一键清理会话、推理报错自动重试、加载项目 Claude 技能、重启按钮、手机大按钮与官方功能开关。停用任一行
# 只下线该行的路由或 provider，其余行照常运行；前端从根行的状态路由得知哪些行可用。
# Declaration only; no global/host configuration is touched.
- insert:
    # 根行：携带浏览器半部与 GET /api/dsh-practical-tools/status。
    - id: dsh-plugin-practical-tool-bundle
      name: dsh-plugin-practical-tool-bundle
    # 一键清理会话：侧栏底部扫帚与归档/删除路由。
    - id: session-sweeper
      name: dsh-plugin-practical-tool-bundle/sweeper
    # 推理报错自动重试：provider 拒绝历史推理块时去掉推理块并重试同一步。
    - id: reasoning-reset
      name: dsh-plugin-practical-tool-bundle/reasoning-reset
    # 加载项目 Claude 技能：把项目 .claude/skills 并入技能目录，只读。
    - id: claude-skills
      name: dsh-plugin-practical-tool-bundle/claude-skills
    # 重启按钮：侧栏底部按钮与重启路由。
    - id: restart-button
      name: dsh-plugin-practical-tool-bundle/restart
    # 手机大按钮：≤767px 生效的样式表路由。
    - id: mobile-touch-ui
      name: dsh-plugin-practical-tool-bundle/mobile
    # 官方功能开关：面板、功能状态路由，与在运行期开关官方行和 preset 子行。
    - id: official-features
      name: dsh-plugin-practical-tool-bundle/official-features
